name: Build Spofy Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies & add Android platform
        run: |
          npm install
          npx cap add android
          npx cap sync android

      - name: Apply Custom Bulby App Icon to Android APK
        run: |
          for dir in android/app/src/main/res/mipmap-*; do
            if [ -d "$dir" ]; then
              cp -f www/assets/app-icon.png "$dir/ic_launcher.png" || true
              cp -f www/assets/app-icon.png "$dir/ic_launcher_round.png" || true
              cp -f www/assets/app-icon.png "$dir/ic_launcher_foreground.png" || true
            fi
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26 || true

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: Spofy-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
